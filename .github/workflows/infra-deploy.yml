name: Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    name: Provision production resources
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep template
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_DEPLOYMENT_NAME: ${{ vars.AZURE_DEPLOYMENT_NAME }}
          AZURE_PIPELINE_IDENTITY_PRINCIPAL_ID: ${{ vars.AZURE_PIPELINE_IDENTITY_PRINCIPAL_ID }}
          POSTGRES_ADMIN_USERNAME: ${{ vars.POSTGRES_ADMIN_USERNAME }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ACR_SKU_NAME: ${{ vars.ACR_SKU_NAME || 'Basic' }}
          POSTGRES_SKU_NAME: ${{ vars.POSTGRES_SKU_NAME || 'Standard_B1ms' }}
          POSTGRES_SKU_TIER: ${{ vars.POSTGRES_SKU_TIER || 'Burstable' }}
          REDIS_SKU_NAME: ${{ vars.REDIS_SKU_NAME || 'Standard' }}
          REDIS_SKU_FAMILY: ${{ vars.REDIS_SKU_FAMILY || 'C' }}
          REDIS_SKU_CAPACITY: ${{ vars.REDIS_SKU_CAPACITY || '0' }}
        run: |
          set -euo pipefail
          required_variables=(
            AZURE_RESOURCE_GROUP
            AZURE_LOCATION
            AZURE_DEPLOYMENT_NAME
            AZURE_PIPELINE_IDENTITY_PRINCIPAL_ID
            POSTGRES_ADMIN_USERNAME
            POSTGRES_ADMIN_PASSWORD
            JWT_SECRET
            ACR_SKU_NAME
            POSTGRES_SKU_NAME
            POSTGRES_SKU_TIER
            REDIS_SKU_NAME
            REDIS_SKU_FAMILY
            REDIS_SKU_CAPACITY
          )
          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::Required production environment variable or secret is empty: $variable_name"
              exit 1
            fi
          done
          if ! [[ "$REDIS_SKU_CAPACITY" =~ ^[0-9]+$ ]]; then
            echo '::error::REDIS_SKU_CAPACITY must be an integer matching the selected Redis SKU.'
            exit 1
          fi
          az bicep build --file infra/main.bicep --stdout >/dev/null
          if ! az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_DEPLOYMENT_NAME" \
            --template-file infra/main.bicep \
            --parameters \
              environmentName=production \
              location="$AZURE_LOCATION" \
              pipelineIdentityPrincipalId="$AZURE_PIPELINE_IDENTITY_PRINCIPAL_ID" \
              postgresAdminUsername="$POSTGRES_ADMIN_USERNAME" \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              jwtSecret="$JWT_SECRET" \
              acrSkuName="$ACR_SKU_NAME" \
              postgresSkuName="$POSTGRES_SKU_NAME" \
              postgresSkuTier="$POSTGRES_SKU_TIER" \
              redisSkuName="$REDIS_SKU_NAME" \
              redisSkuFamily="$REDIS_SKU_FAMILY" \
              redisSkuCapacity="$REDIS_SKU_CAPACITY"; then
            echo '::error::Azure deployment failed. ARM deployment error:'
            az deployment group show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_DEPLOYMENT_NAME" \
              --query properties.error \
              --output json || true
            echo 'ARM failed resource operations:'
            az deployment operation group list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_DEPLOYMENT_NAME" \
              --query "[?properties.provisioningState=='Failed'].properties.statusMessage" \
              --output json || true
            exit 1
          fi
          az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_DEPLOYMENT_NAME" \
            --query properties.outputs \
            --output json