name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test backend
        run: mvn -B test '-Dtest=*,!SchemaExportTest'

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Build container image
        run: docker build --tag ecommerce-ci-check .

  deploy:
    name: Deploy production container
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build, push, and deploy image
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
          AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          AZURE_IMAGE_NAME: ${{ vars.AZURE_IMAGE_NAME }}
        run: |
          set -euo pipefail
          trim_whitespace() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }
          for variable_name in AZURE_RESOURCE_GROUP AZURE_CONTAINER_REGISTRY_NAME AZURE_CONTAINER_APP_NAME AZURE_IMAGE_NAME; do
            printf -v "$variable_name" '%s' "$(trim_whitespace "${!variable_name}")"
          done
          if [[ -z "$AZURE_RESOURCE_GROUP" || -z "$AZURE_CONTAINER_REGISTRY_NAME" || -z "$AZURE_CONTAINER_APP_NAME" || -z "$AZURE_IMAGE_NAME" ]]; then
            echo '::error::One or more required Azure deployment variables are empty after trimming whitespace.'
            exit 1
          fi
          if ! [[ "$AZURE_IMAGE_NAME" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]; then
            echo '::error::AZURE_IMAGE_NAME must be a lowercase Docker repository name without whitespace.'
            exit 1
          fi
          az acr login --name "$AZURE_CONTAINER_REGISTRY_NAME"
          registry_server=$(az acr show --name "$AZURE_CONTAINER_REGISTRY_NAME" --query loginServer --output tsv)
          image="$registry_server/$AZURE_IMAGE_NAME:$GITHUB_SHA"
          docker build --tag "$image" .
          docker push "$image"
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --image "$image"
          az containerapp ingress update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --target-port 8080